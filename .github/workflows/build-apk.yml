name: Build Android APK (Test Keystore)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug and Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Setup Test Keystore for Signing
        run: |
          echo "Setting up test keystore..."
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass testkeystore123 \
              -keypass testkeystore123 \
              -dname "CN=GrokAI, OU=Mobile, O=AIStudio, L=Global, S=Online, C=US"
            echo "Created fresh test keystore: my-upload-key.jks"
          else
            echo "Using existing my-upload-key.jks"
          fi

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (Signed with Test Keystore)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: testkeystore123
          KEY_PASSWORD: testkeystore123
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify and Organize APK Outputs
        run: |
          mkdir -p apk_output
          find app/build/outputs/apk/ -name "*.apk" -type f | while read -r apk_path; do
            echo "Found APK: $apk_path"
            cp "$apk_path" apk_output/
          done
          ls -la apk_output/

      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grok-ai-apks
          path: apk_output/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: GitHub Step Summary
        run: |
          echo "## 🚀 Grok AI Android APK Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Triggered by:** \`${{ github.event_name }}\` on branch \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Generated APK Files:" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          for file in apk_output/*.apk; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              size=$(ls -lh "$file" | awk '{print $5}')
              echo "| \`$filename\` | $size |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "You can download the APK from the **Artifacts** section of this workflow run." >> $GITHUB_STEP_SUMMARY
