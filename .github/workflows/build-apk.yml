name: Build Android APK (Test Keystore)

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a2f43a5d894b9ff6840194d402e" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Prepare Keystores & Environment
        run: |
          echo "Setting up keystores..."
          # 1. Restore or generate debug.keystore required by debugConfig
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Decoding debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating fresh debug.keystore..."
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass android \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 2. Setup upload test keystore for releaseConfig
          if [ ! -f "my-upload-key.jks" ]; then
            echo "Generating test release keystore: my-upload-key.jks..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass testkeystore123 \
              -keypass testkeystore123 \
              -dname "CN=GrokAI, OU=Mobile, O=AIStudio, L=Global, S=Online, C=US"
          fi

          # 3. Ensure .env exists to prevent Secrets plugin warning
          if [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: testkeystore123
          KEY_PASSWORD: testkeystore123
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect Output APKs
        run: |
          mkdir -p apk_output
          find app/build/outputs/apk/ -name "*.apk" -type f | while read -r apk; do
            echo "Found: $apk"
            cp "$apk" apk_output/
          done
          ls -lh apk_output/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grok-ai-apks
          path: apk_output/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Build Summary
        run: |
          echo "## 🚀 Android APK Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.ref_name }}\` | Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Generated APKs:" >> $GITHUB_STEP_SUMMARY
          for f in apk_output/*.apk; do
            if [ -f "$f" ]; then
              name=$(basename "$f")
              size=$(ls -lh "$f" | awk '{print $5}')
              echo "- **$name** ($size)" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "APKs are available in the **Artifacts** section at the top of this run." >> $GITHUB_STEP_SUMMARY
